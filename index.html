<!doctype html>
<!-- AI-assisted (OpenAI Codex; Claude Code restyled the dialog and set the font pair) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Harvest</title>
<style>
  html, body, #game { height: 100%; margin: 0; background: #100d0d; }
  #error { color: #fff0d9; padding: 2rem; font: 1rem system-ui; }
  .colony-name-dialog { box-sizing: border-box; width: min(440px, 92vw); color: #f5e9e2; background: #231615; border: 2px solid #f0886a; border-radius: 14px; padding: 22px 24px; font: 18px/1.3 var(--font-body, 'Patrick Hand', system-ui, sans-serif); box-shadow: 0 12px 40px #0b0505cc; }
  .colony-name-dialog::backdrop { background: #100d0dcc; }
  .colony-name-dialog h2 { margin: 0 0 8px; font: 700 36px/1 var(--font-display, 'Amatic SC', system-ui, sans-serif); letter-spacing: .06em; }
  .colony-name-dialog .colony-name-intro { color: #c9b3a8; margin: 0 0 14px; line-height: 1.35; }
  .colony-name-dialog label { color: #d6b4a1; font: 700 22px/1 var(--font-display, 'Amatic SC', system-ui, sans-serif); letter-spacing: .06em; }
  .colony-name-dialog input { box-sizing: border-box; display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font: inherit; font-size: 20px; color: #f5e9e2; background: #1b1110; border: 1px solid #6e4b42; border-radius: 8px; }
  .colony-name-dialog input:focus { outline: 2px solid #f0886a; outline-offset: 1px; }
  .colony-name-dialog button { padding: 9px 16px; margin-right: 8px; font: inherit; color: #f5e9e2; background: #3a2623; border: 1px solid #6e4b42; border-radius: 8px; cursor: pointer; }
  .colony-name-dialog button[value="save"], .colony-name-dialog button[value="confirm"] { color: #1b1110; background: #f0886a; border-color: #f0886a; }
  .colony-name-dialog button:hover { border-color: #ffd27a; }
  .colony-name-dialog p[role="alert"] { color: #ffad91; min-height: 1.2em; margin: 8px 0; }
</style>
</head>
<body>
<main id="game" aria-label="Red Harvest Mars greenhouse game">
<p id="error" role="status">Loading Red Harvest…</p>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
